name: Build Run and Test EmbedDB Desktop

on:
    push:

jobs:
    build_platformIO:
        name: Build and Run EmbedDB Using PlatformIO
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        
        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
            
            - name: Install PlatformIO
              run: |
                python -m pip install --upgrade pip
                python -m pip install platformio

           - name: Run EmbedDB Distribution Example (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                pio run -e desktop-dist -t fullclean
                PLATFORMIO_BUILD_FLAGS="-DWHICH_PROGRAM=0 -lm" pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Sequential Data Benchmark (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                pio run -e desktop-dist -t fullclean
                PLATFORMIO_BUILD_FLAGS="-DWHICH_PROGRAM=1 -lm" pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Variable Data Benchmark (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                pio run -e desktop-dist -t fullclean
                PLATFORMIO_BUILD_FLAGS="-DWHICH_PROGRAM=2 -lm" pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Query Interface Benchmark (Ubuntu)
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: |
                pio run -e desktop-dist -t fullclean
                PLATFORMIO_BUILD_FLAGS="-DWHICH_PROGRAM=3 -lm" pio run -e desktop-dist -t exec
            
            
            - name: Run EmbedDB Distribution Example (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                pio run -e desktop-dist -t fullclean
                $env:PLATFORMIO_BUILD_FLAGS='-DWHICH_PROGRAM=0 -lm'; pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Sequential Data Benchmark (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                pio run -e desktop-dist -t fullclean
                $env:PLATFORMIO_BUILD_FLAGS='-DWHICH_PROGRAM=1 -lm'; pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Variable Data Benchmark (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                pio run -e desktop-dist -t fullclean
                $env:PLATFORMIO_BUILD_FLAGS='-DWHICH_PROGRAM=2 -lm'; pio run -e desktop-dist -t exec
            
            - name: Run EmbedDB Distribution Query Interface Benchmark (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                pio run -e desktop-dist -t fullclean
                $env:PLATFORMIO_BUILD_FLAGS='-DWHICH_PROGRAM=3 -lm'; pio run -e desktop-dist -t exec
        
    test_platformIO:
        name: Test EmbedDB using PlatformIO
        needs: build_platformIO
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        
        steps:
            - uses: actions/checkout@v3
            - name: Set up Python
              uses: actions/setup-python@v4
            - name: Install PlatformIO
              run: |
                python -m pip install --upgrade pip
                python -m pip install platformio
            - name: Run Tests
              run: pio test -e desktop --junit-output-path "results.xml"

            - name: Publish Unit Test Results
              if: matrix.os == 'ubuntu-latest'
              uses: EnricoMi/publish-unit-test-result-action/composite@v2
              with:
                github_token: ${{ github.token }}
                files: results.xml
                check_name: PlatformIO Ubuntu Unit Test Results

    build_make:
        name: Build and Run EmbedDB using Makefile

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - uses: actions/checkout@v3

            - name: Run EmbedDB Example
              run: | 
                make clean
                make build

            - name: Run EmbedDB Sequential Data Benchmark
              run: |
                make clean
                make build CFLAGS="-DWHICH_PROGRAM=1"

            - name: Run EmbedDB Variable Data Benchmark
              run: |
                make clean
                make build CFLAGS="-DWHICH_PROGRAM=2"

            - name: Run EmbedDB Query Interface Benchmark
              run: |
                make clean
                make build CFLAGS="-DWHICH_PROGRAM=3"

    test_make:
        name: Test EmbedDB using Makefile
        needs: build_make

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
            
        steps:
          - uses: actions/checkout@v3
        
          - name: Get Submodules
            run: git submodule update --init --recursive
        
          - name: Build and Run Unit Tests
            run: make test
        
          - name: Publish Unit Test Results
            if: matrix.os == 'ubuntu-latest'
            uses: EnricoMi/publish-unit-test-result-action/composite@v2
            with:
              github_token: ${{ github.token }}
              files: ./build/results/*.xml
              check_name: Makefile Ubuntu Unit Test Results
